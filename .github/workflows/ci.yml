name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # semantic-release picks the next version from commit messages, so every commit
  # that lands on main must follow Conventional Commits.
  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Lint commit messages
        run: >-
          bunx commitlint --verbose
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      # Turborepo's local cache: tasks whose inputs haven't changed since a cached run are
      # replayed, outputs included, instead of run again.
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      # postinstall runs `wxt prepare`, which generates the .wxt types tsc needs.
      - run: bun install --frozen-lockfile

      # Typecheck and test every package, and zip the extension for Chrome and Firefox (with
      # sources for AMO review). The site is built too; pages.yml publishes it.
      - run: bunx turbo run compile test zip zip:firefox
      - run: bunx turbo run build --filter=open-browser-translate-site

      - uses: actions/upload-artifact@v4
        with:
          name: extension-zips
          path: apps/extension/.output/*.zip
          if-no-files-found: error
          # .output is a dot-directory, which upload-artifact skips by default.
          include-hidden-files: true

  # Tags, writes CHANGELOG.md, bumps package.json, rebuilds the zips at the new
  # version and publishes a GitHub release — only when commits since the last
  # release include a feat, fix or breaking change. On dev it publishes a beta
  # (vX.Y.Z-beta.N) as a GitHub prerelease instead, and commits nothing back.
  release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    needs: build
    runs-on: ubuntu-latest
    # One queue per branch: a new push replaces a queued run on its own branch only,
    # so a dev push can't drop a pending main release.
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # semantic-release 25 needs Node ^22.14 or >=24.10.
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - run: bun install --frozen-lockfile

      # Once this run finishes, chrome-web-store.yml submits a new stable release's
      # Chrome zip to the Chrome Web Store.
      - name: Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npx semantic-release

      # Betas count from the latest stable tag reachable from dev, but main's release
      # commit and tag aren't on dev, so merge them back after each stable release.
      # dev never commits package.json or CHANGELOG.md, so the merge doesn't conflict.
      # Pushes made with GITHUB_TOKEN don't trigger workflows, so this doesn't cut a beta.
      - name: Merge the release back into dev
        if: github.ref == 'refs/heads/main'
        run: |
          tag=$(git describe --tags --abbrev=0 --exclude '*-*' HEAD)
          git fetch origin dev:refs/remotes/origin/dev
          if git merge-base --is-ancestor "$tag" origin/dev; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B dev origin/dev
          git merge --no-edit -m "chore(release): Merge $tag back into dev" "$tag"
          git push origin dev
