name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # semantic-release picks the next version from commit messages, so every commit
  # that lands on main must follow Conventional Commits.
  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Lint commit messages
        run: >-
          bunx commitlint --verbose
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      # Turborepo's local cache: tasks whose inputs haven't changed since a cached run are
      # replayed, outputs included, instead of run again.
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      # postinstall runs `wxt prepare`, which generates the .wxt types tsc needs.
      - run: bun install --frozen-lockfile

      # Typecheck and test every package, and zip the extension for Chrome and Firefox (with
      # sources for AMO review). The site is built too; pages.yml publishes it.
      - run: bunx turbo run compile test zip zip:firefox
      - run: bunx turbo run build --filter=open-browser-translate-site

      - uses: actions/upload-artifact@v4
        with:
          name: extension-zips
          path: apps/extension/.output/*.zip
          if-no-files-found: error
          # .output is a dot-directory, which upload-artifact skips by default.
          include-hidden-files: true

  # Tags, writes CHANGELOG.md, bumps package.json, rebuilds the zips at the new
  # version and publishes a GitHub release — only when commits since the last
  # release include a feat, fix or breaking change.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # semantic-release 25 needs Node ^22.14 or >=24.10.
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - run: bun install --frozen-lockfile

      # After the GitHub release, scripts/release/submit-chrome-web-store.sh submits the
      # Chrome zip to the Chrome Web Store for review. It skips prereleases, and skips
      # with a warning while the CHROME_* secrets are unset (set them with
      # scripts/setup-chrome-web-store.sh). A failed submission fails this job.
      - name: Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CHROME_API_VERSION: v2
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
        run: npx semantic-release
