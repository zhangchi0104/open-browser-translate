name: Pages

# Publishes apps/site (the home page and the privacy policy the store listing links to) to
# https://zhangchi0104.github.io/open-browser-translate/. Pull requests only build it.
on:
  push:
    branches: [main]
    paths:
      - apps/site/**
      - apps/extension/src/styles/theme.css
      - docs/privacy-policy.md
      - store/chrome/**
      - bun.lock
      - turbo.json
      - .github/workflows/pages.yml
  pull_request:
    paths:
      - apps/site/**
      - apps/extension/src/styles/theme.css
      - docs/privacy-policy.md
      - store/chrome/**
      - bun.lock
      - turbo.json
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v5

      # Reads the site's Pages settings; its base path becomes Vite's `base`. Skipped on pull
      # requests, which only check that the site builds (and may run before Pages is set up).
      - id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-pages-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-pages-${{ runner.os }}-

      - run: bun install --frozen-lockfile
      - run: bunx turbo run build --filter=open-browser-translate-site
        env:
          SITE_BASE: ${{ github.event_name != 'pull_request' && format('{0}/', steps.pages.outputs.base_path) || '' }}

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/site/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
